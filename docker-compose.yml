services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      STORAGE_PATH: /app/runtime
      DATABASE_URL: sqlite:////app/runtime/pharmagraph.db
      FRONTEND_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-}
      EMBEDDING_MODEL: local-hashing-v1
      LLM_PROVIDER: offline
    volumes: ["research_data:/app/runtime"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
  postgres:
    image: postgres:17-alpine
    profiles: [production-services]
    environment:
      POSTGRES_DB: pharmagraph
      POSTGRES_USER: pharmagraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  neo4j:
    image: neo4j:5-community
    profiles: [production-services]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    volumes: ["neo4j_data:/data"]
volumes:
  research_data:
  postgres_data:
  neo4j_data:
