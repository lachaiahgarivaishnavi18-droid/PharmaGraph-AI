services:
  - type: web
    name: pharmagraph-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEPLOYMENT_TARGET
        value: render-free
      - key: STORAGE_PATH
        value: /app/runtime
      - key: DATABASE_URL
        fromDatabase:
          name: pharmagraph-demo-db
          property: connectionString
      - key: DOCUMENT_STORAGE
        value: database
      - key: VECTOR_STORE
        value: sqlite
      - key: EMBEDDING_MODEL
        value: local-hashing-v1
      - key: LLM_PROVIDER
        value: offline
      - key: FRONTEND_URL
        value: https://pharmagraph-ai-nine.vercel.app
databases:
  # Free Render PostgreSQL expires 30 days after creation. Demo use only.
  - name: pharmagraph-demo-db
    plan: free
    region: singapore
    databaseName: pharmagraph
    user: pharmagraph
